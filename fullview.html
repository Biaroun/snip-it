<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Snip It</title>
    <link rel="stylesheet" href="popup.css" />
    <link rel="stylesheet" href="fullview.css" />
  </head>
  <body class="fullview">
    <header class="topbar">
      <div class="brand">
        <img src="icons/icon32.png" alt="" />
        <span>Snip It</span>
      </div>
      <div class="header-actions">
        <button id="syncBtn" class="icon-btn" data-i18n-title="syncTitle" title="Sync highlights on this page">🔄</button>
        <button id="optionsBtn" class="icon-btn" data-i18n-title="optionsTitle" title="Options">⚙️</button>
      </div>
    </header>

    <div class="toolbar">
      <input id="search" type="search" data-i18n-placeholder="searchPlaceholder" placeholder="Search notes…" />
    </div>

    <main id="list" class="list"></main>

    <template id="noteTemplate">
      <article class="note">
        <p class="note-text"></p>
        <button class="expand-btn" hidden></button>
        <div class="note-meta">
          <a class="note-source" target="_blank" rel="noopener"></a>
          <time class="note-date"></time>
        </div>
        <div class="note-actions">
          <button class="color-btn"></button>
          <button class="copy-btn"></button>
          <button class="delete-btn"></button>
        </div>
      </article>
    </template>

    <p id="empty" class="empty" hidden></p>

    <div id="colorModal" class="modal-overlay" hidden>
      <div class="modal-card">
        <div class="modal-header">
          <span data-i18n="colorEditorLabel">Note color</span>
          <button id="colorModalClose" class="icon-btn">✕</button>
        </div>
        <div class="sl-square" id="slSquare">
          <div class="sl-thumb" id="slThumb"></div>
        </div>
        <input type="range" id="hueSlider" class="hue-slider" min="0" max="360" value="50" />
        <div class="modal-footer">
          <span class="swatch-preview" id="colorPreview"></span>
          <input type="text" id="hexInput" maxlength="7" spellcheck="false" autocomplete="off" />
        </div>
        <div class="preset-row" id="presetRow"></div>
      </div>
    </div>

    <footer class="footer">
      <span id="count">0 notes</span>
      <div class="footer-actions">
        <button id="exportBtn" class="link-btn" data-i18n="exportBtn">Export as Markdown</button>
        <button id="clearBtn" class="link-btn danger" data-i18n="clearBtn">Clear all</button>
      </div>
    </footer>

    <script src="i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
