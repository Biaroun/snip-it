<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Snip It — Options</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <div class="wrap">
      <header>
        <img src="icons/icon48.png" alt="" />
        <h1>Snip It</h1>
      </header>

      <section class="card">
        <label class="row">
          <div>
            <span class="label">Inclure la source</span>
            <p class="hint">Enregistre le titre et l'URL de la page avec chaque note.</p>
          </div>
          <input type="checkbox" id="includeSource" />
        </label>

        <label class="row">
          <div>
            <span class="label">Notification de sauvegarde</span>
            <p class="hint">Affiche un petit badge ✓ sur l'icône quand une note est enregistrée.</p>
          </div>
          <input type="checkbox" id="notifyOnSave" />
        </label>
      </section>

      <section class="card">
        <div class="row">
          <div>
            <span class="label">Toutes les notes</span>
            <p class="hint" id="noteCount">0 note stockée localement</p>
          </div>
          <button id="clearAll" class="danger-btn">Tout effacer</button>
        </div>
      </section>

      <p id="saved" class="saved" hidden>Préférences enregistrées ✓</p>
    </div>

    <script src="options.js"></script>
  </body>
</html>
